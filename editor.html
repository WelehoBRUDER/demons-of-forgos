<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Map Engine - Map Editor</title>
  <link rel="stylesheet" href="style/main.css">
  <link rel="stylesheet" href="style/editor.css">
</head>

<body>
  <main class="game">
    <p class="paused">--- PAUSED ---</p>
    <div class="fps-counter">0</div>
    <div class="dev-info">0</div>

    <header class="editor-header">
      <button class="save-to-file">Save</button>
      <button class="load-map">Load</button>
      <button class="new-map">New</button>
      <button class="undo">Undo</button>
      <button class="redo">Redo</button>
    </header>

    <div class="editor-popup hidden">
      <button class="close" onclick="popUp.hide()">&times;</button>
      <div class="content"></div>
    </div>

    <div class="editor-panel">
      <button class="editor-button select-mode active">Select</button>
      <button class="editor-button brush-mode">Brush</button>
      <button class="editor-button object-mode">Object</button>
      <button class="editor-button creature-mode">NPC</button>

      <div class="mode-options">
        <h3 class="brush-title">Brush Settings</h2>
          <div class="brush options">
            <div class="size option">
              <p>Brush Size: </p>
              <button class="brush-size-down">-</button>
              <span class="brush-size-display">1</span>
              <button class="brush-size-up">+</button>
            </div>
            <div class="type option">
              <p>Brush Type:</p>
              <select class="brush-type-select">
                <option value="tile">Tile</option>
                <option value="prop">Prop</option>
              </select>
            </div>
          </div>
          <h3 class="palette-title">Tiles</h3>
          <div class="prop-tile-palette">
            <div class="search">
              <input type="text" class="palette-search" placeholder="Search tiles...">
            </div>
            <div class="palette-content"></div>
          </div>
      </div>
      <div class="dynamic-edit"></div>

    </div>
    <div class="editor-info-panel"></div>
    <div class="canvas-layers">
      <canvas class="tile-layer base" width="800" height="600"></canvas>
      <canvas class="prop-layer" width="800" height="600"></canvas>
      <canvas class="object-layer" width="800" height="600"></canvas>
      <canvas class="creature-layer" width="800" height="600"></canvas>
      <canvas class="effect-layer" width="800" height="600"></canvas>
      <canvas class="ui-layer" width="800" height="600"></canvas> <!-- Currently only for cursor highlight -->
    </div>
  </main>
</body>


</html>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    mapRenderer.setMapData(generateEmptyMap(10, 10, 1));
    editor.getMap().addDynamicObject(getDynamicObjectById("wooden_door"), 2, 2);
    entityManager.clearAllEntities();
    game.setControlledCreatureId(null);
    game.setIsEditorMode(true);
    editor.setMode(EditorMode.tile);
    console.log("Editor mode initialized with empty map.");
  });
</script>
